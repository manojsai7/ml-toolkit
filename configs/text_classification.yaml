# Text classification configuration
defaults:
  - base_config

experiment_name: text_classification

data:
  data_dir: data/text
  max_length: 512
  vocab_size: 30000

model:
  model_name: bert-base-uncased
  num_classes: 5
  pretrained: true
  hidden_size: 768

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.00001
  optimizer: adamw
  warmup_steps: 1000
