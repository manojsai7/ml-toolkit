# Image classification configuration
defaults:
  - base_config

experiment_name: image_classification

data:
  data_dir: data/images
  image_size: 224
  augmentation:
    horizontal_flip: true
    rotation: 15
    color_jitter: true

model:
  model_name: resnet50
  num_classes: 100
  pretrained: true

training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.0001
  optimizer: adamw
